<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HEALIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --bg: #F8FAFC;
            --text: #0F172A;
            --text-light: #64748B;
            --glass: rgba(255, 255, 255, 0.8);
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #F5F3FF 50%, #FDF2F8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
        }

        .logo span { color: #7C3AED; }

        .tabs {
            display: flex;
            background: #F1F5F9;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            color: var(--text-light);
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            width: 18px;
            color: var(--text-light);
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #7C3AED);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-light);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        /* Night Mode Support */
        body.night {
            background: #020617;
            color: white;
        }
        body.night .login-card {
            background: rgba(15, 23, 42, 0.8);
            border-color: #1E293B;
        }
        body.night .tab.active { background: #1E293B; color: #60A5FA; }
        body.night .input-wrap input { background: #0F172A; border-color: #334155; color: white; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo" onclick="location.href='pharmacy.html'">🏥 HEALIX<span>Rx</span></div>
    
    <div class="tabs">
        <div class="tab active" id="login-tab" onclick="switchTab('login')">Login</div>
        <div class="tab" id="signup-tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="form-group" id="name-group" style="display:none">
            <label>Full Name</label>
            <div class="input-wrap">
                <i data-lucide="user"></i>
                <input type="text" id="user-name" placeholder="Enter your name">
            </div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrap">
                <i data-lucide="mail"></i>
                <input type="email" id="user-email" placeholder="name@example.com" required>
            </div>
        </div>

        <div class="form-group" id="phone-group" style="display:none">
            <label>Phone Number</label>
            <div class="input-wrap">
                <i data-lucide="phone"></i>
                <input type="tel" id="user-phone" placeholder="+91 XXXXX XXXXX">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
                <i data-lucide="lock"></i>
                <input type="password" id="user-pass" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn" style="display:flex; align-items:center; justify-content:center; gap:8px;">
            <span>Login</span>
            <i data-lucide="arrow-right" style="width:18px"></i>
        </button>
    </form>

    <p class="footer-text" id="footer-text">
        Don't have an account? <a href="#" onclick="switchTab('signup')">Sign up</a>
    </p>
</div>

<script>
    let mode = 'login';

    function switchTab(newMode) {
        mode = newMode;
        document.getElementById('login-tab').classList.toggle('active', mode === 'login');
        document.getElementById('signup-tab').classList.toggle('active', mode === 'signup');
        
        document.getElementById('name-group').style.display = mode === 'signup' ? 'block' : 'none';
        document.getElementById('phone-group').style.display = mode === 'signup' ? 'block' : 'none';
        
        document.getElementById('submit-btn').querySelector('span').innerText = mode === 'signup' ? 'Create Account' : 'Login';
        document.getElementById('footer-text').innerHTML = mode === 'signup' 
            ? 'Already have an account? <a href="#" onclick="switchTab(\'login\')">Login</a>' 
            : 'Don\'t have an account? <a href="#" onclick="switchTab(\'signup\')">Sign up</a>';
        
        lucide.createIcons();
    }

    function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('user-email').value;
        const pass = document.getElementById('user-pass').value;
        const name = document.getElementById('user-name').value;
        const phone = document.getElementById('user-phone').value;

        // Simple Simulated Auth
        const userData = {
            name: mode === 'signup' ? name : 'Guest User',
            email: email,
            phone: mode === 'signup' ? phone : '+91 99999 00000',
            isLoggedIn: true
        };

        localStorage.setItem('healix_user', JSON.stringify(userData));
        
        const btn = document.getElementById('submit-btn');
        btn.innerHTML = '<span class="loader"></span> Success...';
        btn.style.opacity = '0.7';

        setTimeout(() => {
            location.href = 'pharmacy.html';
        }, 1000);
    }

    lucide.createIcons();
</script>

</body>
</html>
